services:
  app:
    security_opt:
      - no-new-privileges:true
    build: .
    container_name: readrepeat
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_PATH=/data/readrepeat.db
      - NODE_ENV=production
      - TZ=Europe/Amsterdam
    volumes:
      - ./data:/data
    networks:
      - caddy
      - kosync

networks:
  caddy:
    external: true
  # Optional: shares the network of a crosspoint-sync server so the
  # crosspoint-sync auto-import feature can reach it by container name.
  # Remove it (and its entry under the service) if you don't use that.
  kosync:
    external: true
