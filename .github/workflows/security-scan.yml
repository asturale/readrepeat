name: security-scan
# Gitleaks (secrets) and Semgrep (code), the same checks as the local pre-commit hook.
# Semgrep only downloads its rules; no code is sent to Semgrep (metrics off, no login).
# On push and pull request only NEW findings fail the run (baseline = the previous commit); the weekly
# run scans everything and is informational. Accepted findings: .gitleaksignore / .semgrepignore.
# Trivy (dependencies) fails the run on fixable HIGH/CRITICAL vulnerabilities in the lockfiles;
# accepted findings go in .trivyignore (one CVE id per line, with a comment why).
on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          # The first push of a new branch has no usable "before": compare with the default branch instead.
          if [ "$EVENT" = push ] && ! { [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; }; then
            BEFORE=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA" 2>/dev/null || true)
            [ "$BEFORE" = "$HEAD_SHA" ] && BEFORE=""
          fi
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ]; then
            ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$BEFORE..$HEAD_SHA" .
          elif [ "$EVENT" = pull_request ]; then
            ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            ./gitleaks dir --redact --no-banner --exit-code 1 .
          fi

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/rules
          for p in default secrets; do curl -sSfL -m 120 "https://semgrep.dev/c/p/$p" -o "/tmp/rules/$p.yml"; done
          BASE=""
          if [ "$EVENT" = push ]; then
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then BASE="$BEFORE"
            else BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)   # new branch
            fi
            [ "$BASE" = "$(git rev-parse HEAD)" ] && BASE=""
          fi
          if [ "$EVENT" = pull_request ]; then BASE="$BASE_SHA"; fi
          ARGS="--metrics=off --disable-version-check --config /tmp/rules/default.yml --config /tmp/rules/secrets.yml --severity ERROR"
          if [ -n "$BASE" ]; then
            semgrep scan $ARGS --error --baseline-commit "$BASE" .
          else
            semgrep scan $ARGS .
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
          # Fixable HIGH/CRITICAL vulnerabilities in dependency lockfiles fail the run.
          # No findings and no lockfiles both exit 0. Accepted CVEs: .trivyignore.
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress --exit-code 1 --db-repository public.ecr.aws/aquasecurity/trivy-db .
